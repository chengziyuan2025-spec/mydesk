[package]
name = "deskbox"
version = "0.2.0"
description = "一个轻量的桌面快捷方式收纳工具"
authors = ["DeskBox"]
edition = "2021"

[lib]
name = "deskbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
dirs = "6"
rfd = "0.15"
sha2 = "0.10"
base64 = "0.22"
trash = "5"
thiserror = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
